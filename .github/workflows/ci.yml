name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test-and-benchmark:
    name: ${{ matrix.runtime }} ${{ matrix.version }} · ${{ matrix.runner }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # Representative released feature lines, not a claim about market share.
          - { runtime: node, version: '26.10.0', runner: ubuntu-24.04, arch: x64 }
          - { runtime: node, version: '24.21.0', runner: ubuntu-24.04, arch: x64 }
          - { runtime: node, version: '22.23.3', runner: ubuntu-24.04, arch: x64 }
          - { runtime: deno, version: '2.9.7', runner: ubuntu-24.04, arch: x64 }
          - { runtime: deno, version: '2.8.3', runner: ubuntu-24.04, arch: x64 }
          - { runtime: deno, version: '2.7.14', runner: ubuntu-24.04, arch: x64 }
          - { runtime: bun, version: '1.4.2', runner: ubuntu-24.04, arch: x64 }
          - { runtime: bun, version: '1.3.14', runner: ubuntu-24.04, arch: x64 }
          - { runtime: bun, version: '1.2.23', runner: ubuntu-24.04, arch: x64 }
          - { runtime: node, version: '26.10.0', runner: ubuntu-24.04-arm, arch: arm64 }
          - { runtime: deno, version: '2.9.7', runner: ubuntu-24.04-arm, arch: arm64 }
          - { runtime: bun, version: '1.4.2', runner: ubuntu-24.04-arm, arch: arm64 }
          - { runtime: node, version: '26.10.0', runner: macos-14, arch: arm64 }
          - { runtime: deno, version: '2.9.7', runner: macos-14, arch: arm64 }
          - { runtime: bun, version: '1.4.2', runner: macos-14, arch: arm64 }
    env:
      TEST_RUNTIME: ${{ matrix.runtime }}
      BENCH_RUNTIME: ${{ matrix.runtime }}
      TEST_RUNTIME_VERSION: ${{ matrix.version }}
      BENCH_RUNTIME_VERSION: ${{ matrix.version }}
      EXPECTED_ARCH: ${{ matrix.arch }}
      CI_REPORT_LABEL: ${{ matrix.runtime }}-${{ matrix.version }}-${{ matrix.runner }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install Node coordinator
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.21.0'
          cache: npm
      - name: Install selected Node
        if: matrix.runtime == 'node'
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ matrix.version }}
      - name: Install selected Deno
        if: matrix.runtime == 'deno'
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: ${{ matrix.version }}
      - name: Install selected Bun
        if: matrix.runtime == 'bun'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ matrix.version }}
      - name: Verify runner and record environment
        run: node scripts/ci-environment.mjs
      - run: npm ci --ignore-scripts
      - run: npm run build
      - name: Verify SemVer release rules without publishing
        run: node scripts/ci-release-check.mjs
      - name: Tests, including runtime property tests
        id: tests
        run: npm run test:ci
      - name: Comparative benchmarks
        if: always() && steps.tests.outcome != 'skipped'
        run: npm run bench:ci
      - name: Upload test and benchmark reports
        if: always()
        id: reports
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: reports-${{ env.CI_REPORT_LABEL }}
          path: reports/
          if-no-files-found: error
          retention-days: 30
      - name: Link reports in job summary
        if: always()
        env:
          REPORT_URL: ${{ steps.reports.outputs.artifact-url }}
        run: node scripts/ci-summary.mjs

  release:
    name: Tagged release with reports
    needs: test-and-benchmark
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: release-main
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.21.0'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: reports-*
          path: release-reports
      - name: Create SemVer release and attach exact-run reports
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release-github.mjs
